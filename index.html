---
layout: null
---
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Saya</title>

  <!-- Anti-flash: set tema sebelum render -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    /* === VARIABEL WARNA === */
    :root,
    [data-theme="light"] {
      --bg: #ffffff;
      --bg-card: #ffffff;
      --text: #222222;
      --text-muted: #888888;
      --text-body: #555555;
      --border: #eeeeee;
      --link: #0366d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --btn-bg: #f4f4f4;
      --btn-text: #222222;
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --bg-card: #181b22;
      --text: #e8e8e8;
      --text-muted: #9aa0a6;
      --text-body: #b8bcc2;
      --border: #2a2e37;
      --link: #6cb6ff;
      --shadow: rgba(0, 0, 0, 0.4);
      --btn-bg: #232733;
      --btn-text: #e8e8e8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* === HEADER + TOGGLE === */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .toggle {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .toggle:hover { transform: scale(1.05); }
    .toggle:active { transform: scale(0.97); }

    .toggle svg {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* === GRID === */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
      transition: transform 0.15s ease, box-shadow 0.15s ease,
                  background 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px var(--shadow);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .card h2 a {
      color: var(--link);
      text-decoration: none;
    }

    .card h2 a:hover { text-decoration: underline; }

    .card .tanggal {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .card p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--text-body);
    }

    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Blog Saya</h1>
    <button class="toggle" id="themeToggle" aria-label="Ganti tema">
      <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <span id="themeLabel">Dark</span>
    </button>
  </header>

  <div class="grid">
    {% for post in site.posts %}
    <article class="card">
      {% if post.image %}
        <a href="{{ post.url }}">
          <img src="{{ post.image }}" alt="{{ post.title }}" loading="lazy">
        </a>
      {% endif %}
      <div class="card-body">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <div class="tanggal">{{ post.date | date: "%d %B %Y" }}</div>
        <p>{{ post.excerpt | strip_html | truncatewords: 18 }}</p>
      </div>
    </article>
    {% endfor %}
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var iconMoon = document.getElementById('iconMoon');
      var iconSun = document.getElementById('iconSun');
      var label = document.getElementById('themeLabel');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
          iconMoon.style.display = 'none';
          iconSun.style.display = 'inline-block';
          label.textContent = 'Light';
        } else {
          iconMoon.style.display = 'inline-block';
          iconSun.style.display = 'none';
          label.textContent = 'Dark';
        }
      }

      apply(root.getAttribute('data-theme') || 'light');

      btn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme');
        apply(current === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>

</body>
</html>
