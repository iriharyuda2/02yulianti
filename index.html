---
layout: null
---
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Saya</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .post {
      border-bottom: 1px solid #eee;
      padding: 24px 0;
      display: flex;
      gap: 20px;
    }
    .post img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .post h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .post h2 a { color: #0366d6; text-decoration: none; }
    .post h2 a:hover { text-decoration: underline; }
    .post .tanggal { color: #888; font-size: 0.9rem; }
    .post p { margin: 8px 0 0; line-height: 1.5; }
  </style>
</head>
<body>

  <h1>Blog Saya</h1>

  {% for post in site.posts %}
  <div class="post">
    {% if post.image %}
      <img src="{{ post.image }}" alt="{{ post.title }}">
    {% endif %}
    <div>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <div class="tanggal">{{ post.date | date: "%d %B %Y" }}</div>
      <p>{{ post.excerpt | strip_html | truncatewords: 25 }}</p>
    </div>
  </div>
  {% endfor %}

</body>
</html>
