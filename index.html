---
layout: null
---
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <meta name="description" content="A personal blog.">
  <link rel="canonical" id="canonicalLink" href="">
  <meta name="robots" content="index, follow">

  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    :root,
    [data-theme="light"] {
      --bg: #ffffff;
      --bg-card: #ffffff;
      --text: #222222;
      --text-muted: #888888;
      --border: #eeeeee;
      --link: #0366d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --btn-bg: #f4f4f4;
      --btn-text: #222222;
      --play-bg: rgba(0, 0, 0, 0.45);
      --play-fg: rgba(255, 255, 255, 0.9);
      --menu-bg: #ffffff;
      --overlay: rgba(0, 0, 0, 0.4);
      --duration-bg: rgba(0, 0, 0, 0.7);
      --duration-fg: #ffffff;
      --share-bg: rgba(255, 255, 255, 0.9);
      --share-fg: #222222;
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --bg-card: #181b22;
      --text: #e8e8e8;
      --text-muted: #9aa0a6;
      --border: #2a2e37;
      --link: #6cb6ff;
      --shadow: rgba(0, 0, 0, 0.4);
      --btn-bg: #232733;
      --btn-text: #e8e8e8;
      --play-bg: rgba(0, 0, 0, 0.5);
      --play-fg: rgba(255, 255, 255, 0.85);
      --menu-bg: #181b22;
      --overlay: rgba(0, 0, 0, 0.6);
      --duration-bg: rgba(0, 0, 0, 0.75);
      --duration-fg: #ffffff;
      --share-bg: rgba(40, 44, 54, 0.9);
      --share-fg: #e8e8e8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial,
                   "Noto Sans", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR",
                   sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* === HEADER === */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 1.6rem; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle,
    .hamburger {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    .toggle:hover,
    .hamburger:hover { transform: scale(1.05); }
    .toggle:active,
    .hamburger:active { transform: scale(0.97); }
    .toggle svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }

    .hamburger {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 12px;
    }
    .hamburger svg { display: block; }

    /* === MENU PANEL === */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 90;
    }
    .menu-overlay.open { opacity: 1; visibility: visible; }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 280px;
      max-width: 85vw;
      background: var(--menu-bg);
      border-left: 1px solid var(--border);
      padding: 24px 20px;
      transform: translateX(100%);
      transition: transform 0.28s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: -6px 0 24px var(--shadow);
    }
    .menu.open { transform: translateX(0); }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .menu-header strong { font-size: 1.05rem; }

    .menu-close {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.15s ease;
    }
    .menu-close:hover { background: var(--btn-bg); }

    .menu a {
      color: var(--text);
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.98rem;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .menu a:hover {
      background: var(--btn-bg);
      color: var(--link);
    }

    body.menu-open { overflow: hidden; }

    /* === GRID === */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      position: relative;
      display: block;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
      transition: transform 0.15s ease, box-shadow 0.15s ease,
                  background 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px var(--shadow);
    }

    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--btn-bg);
    }

    .card .play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--play-bg);
      color: var(--play-fg);
      border-radius: 50%;
      pointer-events: none;
      transition: background 0.2s ease, transform 0.2s ease;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 2;
    }
    .card .play svg {
      width: 28px;
      height: 28px;
      margin-left: 3px;
    }
    .card:hover .play {
      background: rgba(0, 0, 0, 0.65);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .card .duration {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: var(--duration-bg);
      color: var(--duration-fg);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      z-index: 3;
      pointer-events: none;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      font-variant-numeric: tabular-nums;
    }

    .card .share {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      background: var(--share-bg);
      color: var(--share-fg);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      z-index: 4;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease,
                  background 0.2s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .card:hover .share,
    .card .share:focus-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card .share:hover {
      background: var(--link);
      color: #fff;
    }
    .card .share svg {
      width: 18px;
      height: 18px;
    }

    @media (hover: none) {
      .card .share {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === PAGINATION === */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 40px 0 20px;
      flex-wrap: wrap;
    }
    .pagination a,
    .pagination span {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      min-width: 36px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      line-height: 1.4;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .pagination a:hover { transform: translateY(-2px); }
    .pagination .active {
      background: var(--link);
      color: #fff;
      border-color: var(--link);
    }
    .pagination .disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .pagination .dots {
      background: transparent;
      border: none;
      cursor: default;
    }

    /* === COOKIE BANNER === */
    .cookie-banner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 420px;
      margin: 0 auto;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 8px 28px var(--shadow);
      font-size: 0.9rem;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 300;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .cookie-banner.hide {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }
    .cookie-banner p {
      margin: 0;
      flex: 1;
    }
    .cookie-ok {
      background: var(--link);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      flex-shrink: 0;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .cookie-ok:hover { opacity: 0.9; }
    .cookie-ok:active { transform: scale(0.96); }

    /* === WHATSAPP FLOAT (kecil, mepet bawah) === */
    .wa-float {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 42px;
      height: 42px;
      background: #25D366;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
      z-index: 250;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .wa-float:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.55);
    }
    .wa-float:active {
      transform: scale(0.95);
    }
    .wa-float svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
    }
    .wa-float::before {
      content: "Chat via WhatsApp";
      position: absolute;
      right: 52px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .wa-float:hover::before {
      opacity: 1;
    }

    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      box-shadow: 0 6px 24px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === RESPONSIVE === */
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .card .play { width: 52px; height: 52px; }
      .card .play svg { width: 22px; height: 22px; }
      .cookie-banner {
        left: 12px;
        right: 12px;
        bottom: 56px;
        padding: 12px 14px;
        font-size: 0.85rem;
      }
      .wa-float {
        bottom: 8px;
        right: 8px;
        width: 40px;
        height: 40px;
      }
      .wa-float svg {
        width: 20px;
        height: 20px;
      }
      .wa-float::before {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Blog</h1>
    <div class="header-actions">
      <button class="toggle" id="themeToggle" aria-label="Toggle theme">
        <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span id="themeLabel">Dark</span>
      </button>

      <button class="hamburger" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="menu" id="menu" aria-hidden="true">
    <div class="menu-header">
      <strong>Menu</strong>
      <button class="menu-close" id="menuClose" aria-label="Close menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <a href="/">Home</a>
    <a href="/terms-and-conditions.html">Terms and Conditions</a>
    <a href="/contact.html">Contact</a>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </aside>

  <div class="grid" id="grid">
    {% for post in site.posts %}
    <div class="card post-item" data-url="{{ post.url }}" data-title="{{ post.title | escape }}">
      <a class="card-link" href="{{ post.url }}" aria-label="{{ post.title }}">
        {% if post.image %}
          <img src="{{ post.image }}" alt="{{ post.title }}" loading="lazy">
        {% endif %}
        <span class="play" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </span>
        <span class="duration" data-duration></span>
      </a>
      <button class="share" type="button" aria-label="Share" data-share>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </div>
    {% endfor %}
  </div>

  <nav class="pagination" id="pagination" aria-label="Pagination"></nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="cookie-banner" id="cookieBanner" role="dialog" aria-live="polite" aria-label="Cookie notice">
    <p>This site uses cookies to improve your experience.</p>
    <button class="cookie-ok" id="cookieOk">OK</button>
  </div>

  <a class="wa-float"
     href="https://wa.me/6285770366055?text=Hi%2C%20I%20have%20a%20question"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat via WhatsApp">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </a>

  <script>
    /* === THEME TOGGLE === */
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var iconMoon = document.getElementById('iconMoon');
      var iconSun = document.getElementById('iconSun');
      var label = document.getElementById('themeLabel');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
          iconMoon.style.display = 'none';
          iconSun.style.display = 'inline-block';
          label.textContent = 'Light';
        } else {
          iconMoon.style.display = 'inline-block';
          iconSun.style.display = 'none';
          label.textContent = 'Dark';
        }
      }

      apply(root.getAttribute('data-theme') || 'light');

      btn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme');
        apply(current === 'dark' ? 'light' : 'dark');
      });
    })();

    /* === MENU === */
    (function () {
      var menu = document.getElementById('menu');
      var overlay = document.getElementById('menuOverlay');
      var openBtn = document.getElementById('menuBtn');
      var closeBtn = document.getElementById('menuClose');

      function open() {
        menu.classList.add('open');
        overlay.classList.add('open');
        menu.setAttribute('aria-hidden', 'false');
        openBtn.setAttribute('aria-expanded', 'true');
        document.body.classList.add('menu-open');
      }

      function close() {
        menu.classList.remove('open');
        overlay.classList.remove('open');
        menu.setAttribute('aria-hidden', 'true');
        openBtn.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('menu-open');
      }

      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', close);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();

    /* === DURATION (acak tapi konsisten per card) === */
    (function () {
      function hashCode(str) {
        var h = 0;
        for (var i = 0; i < str.length; i++) {
          h = ((h << 5) - h + str.charCodeAt(i)) | 0;
        }
        return Math.abs(h);
      }

      function formatDuration(seconds) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      document.querySelectorAll('.post-item').forEach(function (card) {
        var el = card.querySelector('[data-duration]');
        if (!el) return;

        var seed = card.getAttribute('data-url') || card.getAttribute('data-title') || '';
        var h = hashCode(seed);
        var seconds = 60 + (h % 841);
        el.textContent = formatDuration(seconds);
      });
    })();

    /* === SHARE BUTTON === */
    (function () {
      var toast = document.getElementById('toast');
      var toastTimer;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2000);
      }

      function getShareURL(card) {
        var path = card.getAttribute('data-url') || '';
        return window.location.origin + path;
      }

      function getShareTitle(card) {
        return card.getAttribute('data-title') || document.title;
      }

      document.querySelectorAll('[data-share]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          var card = btn.closest('.post-item');
          var url = getShareURL(card);
          var title = getShareTitle(card);
          var data = { title: title, url: url };

          if (navigator.share) {
            navigator.share(data).catch(function () {});
            return;
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () {
              showToast('Link copied');
            }).catch(function () {
              fallbackCopy(url);
            });
            return;
          }

          fallbackCopy(url);
        });
      });

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Link copied');
        } catch (err) {
          showToast('Copy failed');
        }
        document.body.removeChild(ta);
      }
    })();

    /* === COOKIE BANNER (tombol OK) === */
    (function () {
      var KEY = 'cookie-notice-dismissed';
      var banner = document.getElementById('cookieBanner');
      var okBtn = document.getElementById('cookieOk');

      if (!banner) return;

      if (localStorage.getItem(KEY) === '1') {
        banner.remove();
        return;
      }

      function dismiss() {
        banner.classList.add('hide');
        localStorage.setItem(KEY, '1');
        setTimeout(function () {
          banner.remove();
        }, 300);
      }

      okBtn.addEventListener('click', dismiss);
    })();

    /* === PAGINATION (?pag=N, dynamic SEO) === */
    (function () {
      var PER_PAGE = 6;
      var SITE_NAME = 'My Blog';
      var SITE_DESC = 'A personal blog.';
      var BASE_URL = window.location.origin + window.location.pathname.replace(/\/$/, '');
      var items = document.querySelectorAll('.post-item');
      var nav = document.getElementById('pagination');
      var total = Math.ceil(items.length / PER_PAGE);

      if (total <= 1) { nav.remove(); return; }

      function pageURL(n) {
        return n === 1 ? BASE_URL + '/' : BASE_URL + '/?pag=' + n;
      }

      function getPageFromURL() {
        var params = new URLSearchParams(window.location.search);
        var p = parseInt(params.get('pag'), 10);
        if (isNaN(p) || p < 1) return 1;
        if (p > total) return total;
        return p;
      }

      function upsertMeta(attr, key, content) {
        var el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }

      function upsertLink(rel, href) {
        var el = document.head.querySelector('link[rel="' + rel + '"]');
        if (!el) {
          el = document.createElement('link');
          el.rel = rel;
          document.head.appendChild(el);
        }
        el.href = href;
      }

      function removeLink(rel) {
        var el = document.head.querySelector('link[rel="' + rel + '"]');
        if (el) el.remove();
      }

      function updateHead(page) {
        var title = page === 1
          ? SITE_NAME
          : SITE_NAME + ' — Page ' + page + ' of ' + total;

        var desc = page === 1
          ? SITE_DESC
          : SITE_DESC.replace(/\.$/, '') + ' — page ' + page + ' of ' + total + '.';

        document.title = title;
        upsertMeta('name', 'description', desc);
        upsertLink('canonical', pageURL(page));

        if (page > 1) upsertLink('prev', pageURL(page - 1));
        else removeLink('prev');

        if (page < total) upsertLink('next', pageURL(page + 1));
        else removeLink('next');
      }

      function updateGrid(page) {
        items.forEach(function (el, i) {
          var start = (page - 1) * PER_PAGE;
          var end = start + PER_PAGE;
          el.style.display = (i >= start && i < end) ? '' : 'none';
        });
      }

      function makeLink(text, page, opts) {
        opts = opts || {};
        var el;
        if (opts.disabled) {
          el = document.createElement('span');
          el.className = 'disabled';
        } else {
          el = document.createElement('a');
          el.href = page === 1 ? './' : '?pag=' + page;
        }
        if (opts.active) el.classList.add('active');
        el.textContent = text;
        return el;
      }

      function drawPagination(current) {
        nav.innerHTML = '';

        nav.appendChild(makeLink('‹', current - 1, { disabled: current === 1 }));

        var pages = [];
        if (total <= 7) {
          for (var i = 1; i <= total; i++) pages.push(i);
        } else {
          pages.push(1);
          if (current > 3) pages.push('...');
          var from = Math.max(2, current - 1);
          var to = Math.min(total - 1, current + 1);
          for (var j = from; j <= to; j++) pages.push(j);
          if (current < total - 2) pages.push('...');
          pages.push(total);
        }

        pages.forEach(function (p) {
          if (p === '...') {
            var span = document.createElement('span');
            span.className = 'dots';
            span.textContent = '…';
            nav.appendChild(span);
          } else {
            nav.appendChild(makeLink(p, p, { active: p === current }));
          }
        });

        nav.appendChild(makeLink('›', current + 1, { disabled: current === total }));
      }

      function show(page, scroll) {
        updateGrid(page);
        drawPagination(page);
        updateHead(page);
        if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.addEventListener('popstate', function () {
        show(getPageFromURL(), true);
      });

      nav.addEventListener('click', function (e) {
        var link = e.target.closest('a[href]');
        if (!link) return;
        var href = link.getAttribute('href');
        if (href.indexOf('?pag=') !== 0 && href !== './') return;
        e.preventDefault();
        var url = href === './' ? window.location.pathname : '?pag=' + href.split('=')[1];
        history.pushState({}, '', url);
        show(getPageFromURL(), true);
      });

      show(getPageFromURL(), false);
    })();
  </script>

</body>
</html>
