---
layout: null
---
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Saya</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }

    h1 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    /* GRID RESPONSIVE */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;      /* kotak, konsisten di semua kartu */
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .card h2 a {
      color: #0366d6;
      text-decoration: none;
    }

    .card h2 a:hover { text-decoration: underline; }

    .card .tanggal {
      color: #888;
      font-size: 0.85rem;
    }

    .card p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.45;
      color: #555;
    }

    /* HP kecil: paksa 1 kolom */
    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>Blog Saya</h1>

  <div class="grid">
    {% for post in site.posts %}
    <article class="card">
      {% if post.image %}
        <a href="{{ post.url }}">
          <img src="{{ post.image }}" alt="{{ post.title }}" loading="lazy">
        </a>
      {% endif %}
      <div class="card-body">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <div class="tanggal">{{ post.date | date: "%d %B %Y" }}</div>
        <p>{{ post.excerpt | strip_html | truncatewords: 18 }}</p>
      </div>
    </article>
    {% endfor %}
  </div>

</body>
</html>
