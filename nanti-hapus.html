<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>

<div id="vastPlayer01">

<div id="adContainer01"></div>

<div id="videoBox01">

<div id="changeServerTitle01">Change Server</div>

<div id="serverNotice01">
If the video doesn't play, please try another server.
</div>

<div id="serverButtons01"></div>

<div id="iframeContainer01"></div>

</div>

</div>

<style>
#vastPlayer01{
width:100%;
max-width:900px;
margin:0 auto;
}

#adContainer01{
position:relative;
width:100%;
aspect-ratio:16/9;
background:#000;
overflow:hidden;
}

#videoBox01{
display:none;
width:100%;
}

#changeServerTitle01{
font-size:14px;
font-weight:600;
margin-top:8px;
margin-bottom:3px;
}

#serverNotice01{
font-size:12px;
opacity:.7;
margin-bottom:8px;
}

#serverButtons01{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:10px;
}

#serverButtons01 button{
appearance:none;
border:0;
border-radius:4px;
padding:7px 12px;
background:#333;
color:#fff;
font-size:13px;
line-height:1.2;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

#serverButtons01 button:hover{
background:#555;
}

#serverButtons01 button.active{
background:#777;
}

#iframeContainer01{
width:100%;
aspect-ratio:16/9;
background:#000;
overflow:hidden;
}

#iframeContainer01 iframe{
width:100%;
height:100%;
display:block;
border:0;
margin:0;
padding:0;
}
</style>

<script>
(function(){

var servers01=[
"https://streamtape.com/e/Bap4ZDXYjriyD2X/",
"https://playmogo.com/e/bhikgz3pixi0",
"https://mxdrop.top/e/1nvn7p6ohkw3qz1",
"https://filemoon.org/en/E9Qz9nw6GOL2/embed",
"https://hgcloud.to/e/frk5g32ovgyt",
"https://morencius.com/embed/rrvkhp4g5o46"
];

var vastURLs01=[
"https://unsightlystrain.com/d.moFzz/dpGBNWvTZDGoUY/_eZm/9/ubZOUvlNk/P/Trcv0YORDIQp1/OXT_MetKNhzeQE4_NiDCUO5BN/wF"
];

var vastURL01=
vastURLs01[
Math.floor(
Math.random()*vastURLs01.length
)
];

var adContainer01=
document.getElementById(
"adContainer01"
);

var videoBox01=
document.getElementById(
"videoBox01"
);

var buttons01=
document.getElementById(
"serverButtons01"
);

var iframeContainer01=
document.getElementById(
"iframeContainer01"
);

var adDisplayContainer01;
var adsLoader01;
var adsManager01;
var started01=false;

function showVideo01(){

if(started01)return;

started01=true;

adContainer01.style.display="none";

videoBox01.style.display="block";

loadServer01(0);

}

function loadServer01(index){

if(!servers01[index])return;

iframeContainer01.innerHTML="";

var iframe01=
document.createElement("iframe");

iframe01.src=
servers01[index];

iframe01.setAttribute(
"allow",
"autoplay; fullscreen; picture-in-picture"
);

iframe01.setAttribute(
"allowfullscreen",
""
);

iframe01.setAttribute(
"frameborder",
"0"
);

iframe01.setAttribute(
"scrolling",
"no"
);

iframeContainer01.appendChild(
iframe01
);

var buttons=
buttons01.querySelectorAll(
"button"
);

buttons.forEach(
function(button){
button.classList.remove(
"active"
);
}
);

if(buttons[index]){

buttons[index].classList.add(
"active"
);

}

}

servers01.forEach(
function(server,index){

var button01=
document.createElement("button");

button01.type="button";

button01.textContent=
"Server "+
String(index+1).padStart(
2,
"0"
);

button01.setAttribute(
"data-server",
index
);

if(index===0){

button01.classList.add(
"active"
);

}

buttons01.appendChild(
button01
);

}
);

buttons01.addEventListener(
"click",
function(event){

var button01=
event.target.closest(
"button"
);

if(!button01)return;

var index01=
parseInt(
button01.getAttribute(
"data-server"
),
10
);

loadServer01(index01);

}
);

function initIMA01(){

try{

adDisplayContainer01=
new google.ima.AdDisplayContainer(
adContainer01
);

adsLoader01=
new google.ima.AdsLoader(
adDisplayContainer01
);

adsLoader01.addEventListener(
google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
onAdsManagerLoaded01,
false
);

adsLoader01.addEventListener(
google.ima.AdErrorEvent.Type.AD_ERROR,
onAdError01,
false
);

var adsRequest01=
new google.ima.AdsRequest();

adsRequest01.adTagUrl=
vastURL01;

adsRequest01.linearAdSlotWidth=
adContainer01.offsetWidth;

adsRequest01.linearAdSlotHeight=
adContainer01.offsetHeight;

adsRequest01.nonLinearAdSlotWidth=
adContainer01.offsetWidth;

adsRequest01.nonLinearAdSlotHeight=
adContainer01.offsetHeight;

adsLoader01.requestAds(
adsRequest01
);

}catch(e){

showVideo01();

}

}

function onAdsManagerLoaded01(
event
){

try{

adsManager01=
event.getAdsManager();

adsManager01.addEventListener(
google.ima.AdErrorEvent.Type.AD_ERROR,
onAdError01
);

adsManager01.addEventListener(
google.ima.AdEvent.Type.COMPLETE,
onAdComplete01
);

adsManager01.addEventListener(
google.ima.AdEvent.Type.ALL_ADS_COMPLETED,
onAdComplete01
);

adsManager01.init(
adContainer01.offsetWidth,
adContainer01.offsetHeight,
google.ima.ViewMode.NORMAL
);

adsManager01.start();

}catch(e){

showVideo01();

}

}

function onAdComplete01(){

setTimeout(
function(){
showVideo01();
},
300
);

}

function onAdError01(){

if(adsManager01){

try{
adsManager01.destroy();
}catch(e){}

}

showVideo01();

}

function startIMA01(){

try{

adDisplayContainer01.initialize();

}catch(e){}

initIMA01();

}

if(
window.google&&
google.ima
){

startIMA01();

}else{

setTimeout(
function(){

if(
window.google&&
google.ima
){

startIMA01();

}else{

showVideo01();

}

},
1000
);

}

})();
</script>
