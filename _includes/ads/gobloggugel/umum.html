<style>
#floating-ads-overlay{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.6);
  z-index:99998;
  display:flex;justify-content:center;align-items:center;
  padding:15px;box-sizing:border-box;
}
#floating-ads-overlay.hidden{
  display:none !important;
}
#floating-ads-wrap{
  position:relative;
  width:300px;height:250px;
  max-width:100%;
  animation:fadeInAds .3s ease-in-out;
}
#floating-ads-slot1,#floating-ads-slot2,#floating-ads-slot3{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  display:flex;justify-content:center;align-items:center;
}
#floating-ads-slot1{z-index:3}
#floating-ads-slot2{z-index:2}
#floating-ads-slot3{z-index:1}
#floating-ads-layer1,#floating-ads-layer2,#floating-ads-layer3{
  width:100%;height:100%;
  display:flex;justify-content:center;align-items:center;
}
#floating-ads-fallback{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  background:rgba(255,255,255,.08);
  border:1px dashed rgba(255,255,255,.4);
  border-radius:8px;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:14px;line-height:1.4;
  display:flex;justify-content:center;align-items:center;
  text-align:center;padding:20px;box-sizing:border-box;
  z-index:0;pointer-events:none;
}
@keyframes fadeInAds{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}
.floating-ads-close{
  position:absolute;
  top:4px;left:4px;
  width:22px;height:22px;
  background:transparent;
  color:#ffffff; /* ✅ putih */
  border:none;outline:none;
  border-radius:50%;
  cursor:pointer;
  display:flex;justify-content:center;align-items:center;
  padding:0;overflow:hidden;
  z-index:999999;
}
.floating-ads-close span{
  display:block;
  font-family:Arial,sans-serif;
  font-size:22px;font-weight:400;
  line-height:22px;height:22px;width:22px;
  text-align:center;
  text-shadow:0 0 3px rgba(0,0,0,.8); /* ✅ biar tetap terlihat */
}
.floating-ads-close:hover{
  color:#cccccc; /* ✅ abu terang saat hover */
}
@media(max-width:360px){
  #floating-ads-wrap{width:280px;height:230px}

#floating-ads-wrap ins{max-width:100%;display:block}

<script>
(function(){
  var overlay = document.getElementById("floating-ads-overlay");

  document.querySelectorAll(".floating-ads-close").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();

      // 1. sembunyikan slot yang diklik
      var target = document.getElementById(btn.getAttribute("data-target"));
      if (target) target.style.display = "none";

      // 2. cek apakah masih ada slot yang belum ditutup
      var slots = document.querySelectorAll("#floating-ads-wrap > div[id^='floating-ads-slot']");
      var masihAda = Array.prototype.some.call(slots, function(slot){
        return slot.style.display !== "none";
      });

      // 3. kalau semua slot sudah ditutup → hilangkan overlay total
      if (!masihAda) {
        overlay.classList.add("hidden");
      }
    });
  });
})();
</script>
